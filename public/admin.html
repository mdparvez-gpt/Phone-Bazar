<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding-bottom: 40px; }
    header { background: #0f172a; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 800px; margin: 16px auto; padding: 0 12px; }
    .card { background: #fff; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
    .order-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 12px; }
    .btn { background: #4f46e5; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h2 style="font-size: 14px; color: #818cf8;">PHONE BAZAR ADMIN</h2>
    <button onclick="window.location.href='/'" style="background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;">Logout</button>
  </header>

  <div class="container">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
        <h3 style="font-size: 14px;">Orders History</h3>
        <button onclick="loadOrders()" class="btn">🔄 Refresh</button>
      </div>
      <div id="orders-list"><p style="font-size: 12px; color: #94a3b8; text-align: center; padding: 16px;">Loading...</p></div>
    </div>
  </div>

  <script>
    async function loadOrders() {
      try {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const container = document.getElementById('orders-list');

        if (!orders.length) {
          container.innerHTML = `<p style="font-size: 12px; color: #94a3b8; text-align: center; padding: 16px;">No orders found!</p>`;
          return;
        }

        container.innerHTML = orders.map(o => `
          <div class="order-box">
            <div style="display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 6px;">
              <span style="color: #4f46e5;">${o.id}</span>
              <span style="color: #16a34a;">৳${o.total} (${o.paymentMethod})</span>
            </div>
            <div><b>${o.customer?.name || 'N/A'}</b> (${o.customer?.phone || ''})</div>
            <div style="color: #64748b; font-size: 11px;">${o.customer?.address || ''}</div>
            <div style="margin-top: 6px; font-size: 11px;"><b>Status:</b> ${o.status}</div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('orders-list').innerHTML = `<p style="color: #ef4444; font-size: 12px; text-align: center;">Error loading orders!</p>`;
      }
    }
    loadOrders();
  </script>
</body>
</html>
