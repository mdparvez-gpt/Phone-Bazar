<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Phone Bazar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4">

  <!-- Passcode Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl">
      <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 font-bold text-xl"><i class="fa-solid fa-lock"></i></div>
      <h2 class="font-black text-lg mb-1">Admin Access</h2>
      <p class="text-xs text-gray-500 mb-4">Enter 4-digit Passcode</p>
      <input type="password" id="pass-input" maxlength="4" placeholder="••••" class="w-full text-center text-2xl font-black border border-gray-200 rounded-2xl py-3 mb-4 outline-none focus:border-indigo-600">
      <button onclick="checkPasscode()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs">Login</button>
    </div>
  </div>

  <div id="admin-content" class="max-w-2xl mx-auto hidden">
    <!-- Top Header -->
    <div class="bg-white rounded-2xl p-4 mb-4 border border-gray-200 flex justify-between items-center shadow-sm">
      <h1 class="font-extrabold text-base flex items-center gap-2"><i class="fa-solid fa-bolt text-indigo-600"></i> Phone Bazar Admin</h1>
      <button onclick="location.reload()" class="bg-gray-100 text-gray-700 font-bold text-xs px-3 py-1.5 rounded-xl">Logout</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex gap-2 mb-4">
      <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm">Orders History</button>
      <button onclick="switchTab('products')" id="tab-products" class="flex-1 bg-white text-gray-700 font-bold py-2.5 rounded-xl text-xs border border-gray-200 shadow-sm">Manage Stock</button>
    </div>

    <!-- ORDERS TAB -->
    <div id="view-orders" class="space-y-3">
      <p class="text-center py-8 text-gray-400 font-medium text-xs">Loading orders...</p>
    </div>

    <!-- PRODUCTS TAB -->
    <div id="view-products" class="hidden space-y-4">
      <!-- Add Product Form -->
      <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm">
        <h3 class="font-black text-sm mb-3 flex items-center gap-1.5"><i class="fa-solid fa-plus text-indigo-600"></i> Add New Phone / Product</h3>
        <form onsubmit="event.preventDefault(); addProduct();" class="space-y-2.5">
          <input type="text" id="p-title" required placeholder="Phone Name (e.g. Honor 200)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium outline-none">
          <input type="number" id="p-price" required placeholder="Price in BDT (e.g. 42000)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium outline-none">
          
          <!-- Category Select -->
          <div class="grid grid-cols-2 gap-2">
            <select id="p-brand-select" onchange="toggleCustomBrand()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold outline-none">
              <option value="Apple">Apple</option>
              <option value="Samsung">Samsung</option>
              <option value="Xiaomi">Xiaomi</option>
              <option value="Custom">+ Custom Category</option>
            </select>
            <input type="text" id="p-brand-custom" placeholder="Type Brand (e.g. Honor)" class="hidden w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium outline-none">
          </div>

          <!-- Gallery Image Picker -->
          <div class="bg-gray-50 border border-gray-200 rounded-xl p-2.5">
            <label class="block text-[11px] font-bold text-gray-600 mb-1">Select Image from Gallery:</label>
            <input type="file" id="p-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600">
            <p class="text-[10px] text-gray-400 mt-1">Or paste image URL below:</p>
            <input type="text" id="p-img-url" placeholder="https://..." class="w-full bg-white border border-gray-200 rounded-xl px-3 py-1.5 text-xs outline-none mt-1">
          </div>

          <input type="number" id="p-stock" value="10" placeholder="Stock Units" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium outline-none">
          <button type="submit" id="add-prod-btn" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs">Save Product</button>
        </form>
      </div>

      <!-- Product List -->
      <div id="product-list" class="space-y-2"></div>
    </div>
  </div>

  <script>
    const PASSCODE = '1234';
    let base64Image = '';

    // Convert gallery image to Base64
    document.addEventListener('change', function(e) {
      if(e.target && e.target.id === 'p-file') {
        const file = e.target.files[0];
        if(file) {
          const reader = new FileReader();
          reader.onload = function(evt) { base64Image = evt.target.result; }
          reader.readAsDataURL(file);
        }
      }
    });

    function toggleCustomBrand() {
      const select = document.getElementById('p-brand-select');
      const customInput = document.getElementById('p-brand-custom');
      if(select.value === 'Custom') {
        customInput.classList.remove('hidden');
      } else {
        customInput.classList.add('hidden');
      }
    }

    function checkPasscode() {
      if(document.getElementById('pass-input').value === PASSCODE) {
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        loadOrders();
        fetchProducts();
      } else alert('Wrong Passcode!');
    }

    function switchTab(tab) {
      document.getElementById('view-orders').classList.toggle('hidden', tab !== 'orders');
      document.getElementById('view-products').classList.toggle('hidden', tab !== 'products');
      document.getElementById('tab-orders').className = tab === 'orders' ? 'flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs' : 'flex-1 bg-white text-gray-700 font-bold py-2.5 rounded-xl text-xs border border-gray-200';
      document.getElementById('tab-products').className = tab === 'products' ? 'flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs' : 'flex-1 bg-white text-gray-700 font-bold py-2.5 rounded-xl text-xs border border-gray-200';
    }

    async function loadOrders() {
      try {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const container = document.getElementById('view-orders');
        if(!orders.length) { container.innerHTML = '<p class="text-center py-6 text-gray-400 text-xs font-medium">No orders yet.</p>'; return; }
        container.innerHTML = orders.map(o => `
          <div class="bg-white border border-gray-200 rounded-2xl p-3.5 shadow-sm space-y-2">
            <div class="flex justify-between items-center text-xs border-b pb-2">
              <span class="font-extrabold text-indigo-600">ID: ${o.id.substring(0,8)}</span>
              <span class="font-extrabold text-[10px] px-2 py-0.5 rounded-md bg-amber-100 text-amber-700">${o.status}</span>
            </div>
            <div class="text-xs text-gray-700">
              <p><b>Name:</b> ${o.customer?.name || 'N/A'} (${o.customer?.phone})</p>
              <p><b>Address:</b> ${o.customer?.address}, ${o.customer?.city}</p>
            </div>
            <div class="bg-gray-50 p-2 rounded-xl text-[11px] text-gray-600 space-y-1">
              ${(o.items || []).map(i => `<div>- ${i.title} (x${i.qty})</div>`).join('')}
            </div>
            <div class="flex justify-between items-center pt-1">
              <span class="font-black text-indigo-600 text-sm">৳${Number(o.total||0).toLocaleString()}</span>
              <select onchange="updateStatus('${o.id}', this.value)" class="text-xs font-bold border border-gray-300 rounded-lg px-2 py-1 outline-none">
                <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                <option value="Completed" ${o.status==='Completed'?'selected':''}>Completed</option>
                <option value="Cancelled" ${o.status==='Cancelled'?'selected':''}>Cancelled</option>
              </select>
            </div>
          </div>
        `).join('');
      } catch(e) {}
    }

    async function fetchProducts() {
      try {
        const res = await fetch('/api/phones');
        const prods = await res.json();
        const container = document.getElementById('product-list');
        container.innerHTML = prods.map(p => `
          <div class="bg-white border border-gray-200 rounded-2xl p-3 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3">
              <img src="${p.image || 'https://via.placeholder.com/80'}" class="w-10 h-10 object-contain rounded-lg border">
              <div>
                <h4 class="font-bold text-xs">${p.title} - ৳${Number(p.price).toLocaleString()}</h4>
                <p class="text-[10px] text-gray-500">Brand: <b>${p.brand}</b> | Stock: <b>${p.stock || 10}</b></p>
              </div>
            </div>
            <button onclick="deleteProduct('${p.id}')" class="text-red-500 font-bold text-xs px-2.5 py-1 bg-red-50 rounded-lg">Delete</button>
          </div>
        `).join('');
      } catch(e) {}
    }

    async function addProduct() {
      const title = document.getElementById('p-title').value;
      const price = document.getElementById('p-price').value;
      const selectBrand = document.getElementById('p-brand-select').value;
      const customBrand = document.getElementById('p-brand-custom').value;
      const imgUrl = document.getElementById('p-img-url').value;
      const stock = document.getElementById('p-stock').value;

      const brand = selectBrand === 'Custom' ? customBrand : selectBrand;
      const finalImg = base64Image || imgUrl || 'https://via.placeholder.com/150';

      if(!title || !price || !brand) return alert('Fill name, price and category!');

      const btn = document.getElementById('add-prod-btn');
      btn.innerText = "Saving...";
      btn.disabled = true;

      await fetch('/api/phones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, price: Number(price), brand, image: finalImg, stock: Number(stock) })
      });

      btn.innerText = "Save Product";
      btn.disabled = false;
      base64Image = '';
      document.getElementById('p-title').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-brand-custom').value = '';
      document.getElementById('p-file').value = '';
      fetchProducts();
      alert('Product Added Successfully!');
    }

    async function deleteProduct(id) {
      if(!confirm('Delete product?')) return;
      await fetch('/api/phones/' + id, { method: 'DELETE' });
      fetchProducts();
    }

    async function updateStatus(id, status) {
      await fetch('/api/orders/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadOrders();
    }
  </script>
</body>
</html>
