<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Bazar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-white sticky top-0 z-40 border-b border-gray-200 px-4 py-3 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl">P</div>
      <h1 class="font-extrabold text-xl text-gray-900 tracking-tight">Phone Bazar</h1>
    </div>
    <button onclick="toggleModal('cart-modal', true)" class="bg-gray-900 text-white font-bold px-4 py-2 rounded-xl flex items-center gap-2 relative text-sm">
      <i class="fa-solid fa-cart-shopping text-xs"></i>
      <span>Cart</span>
      <span id="cart-count" class="bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full font-bold ml-1">0</span>
    </button>
  </header>

  <!-- Search & Filters Section -->
  <main class="max-w-4xl mx-auto px-4 mt-4 space-y-3">
    <!-- Search Bar -->
    <div>
      <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search phones..." class="w-full bg-white border border-gray-200 rounded-2xl px-4 py-3 text-sm font-medium outline-none focus:border-indigo-500 shadow-sm">
    </div>

    <!-- Price Range Filter Bar -->
    <div class="bg-white border border-gray-200 rounded-2xl p-3 shadow-sm flex items-center gap-2 text-xs">
      <span class="font-bold text-gray-600"><i class="fa-solid fa-filter text-indigo-600"></i> Price:</span>
      <input type="number" id="min-price" oninput="filterProducts()" placeholder="Min ৳" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-1.5 outline-none font-semibold">
      <span class="text-gray-400 font-bold">-</span>
      <input type="number" id="max-price" oninput="filterProducts()" placeholder="Max ৳" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-1.5 outline-none font-semibold">
      <button onclick="clearPriceFilter()" class="text-xs text-red-500 font-bold px-1.5 py-1 hover:underline">Reset</button>
    </div>

    <!-- Dynamic Brand Categories -->
    <div id="category-container" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
      <button onclick="setCategory('All')" class="cat-btn bg-indigo-600 text-white font-bold px-5 py-2 rounded-2xl text-xs whitespace-nowrap shadow-sm">All</button>
    </div>

    <!-- Products Grid -->
    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4">
      <p class="col-span-full text-center py-10 text-gray-400 font-medium text-sm">Loading products...</p>
    </div>
  </main>

  <!-- Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-gray-100">
        <h3 class="font-black text-lg">Your Cart</h3>
        <button onclick="toggleModal('cart-modal', false)" class="text-gray-400 hover:text-gray-600 font-bold text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="cart-items" class="flex-1 overflow-y-auto py-3 space-y-3"></div>
      <div class="border-t border-gray-100 pt-3">
        <div class="flex justify-between text-sm font-bold mb-3">
          <span>Total:</span>
          <span id="cart-total" class="text-indigo-600 text-base">৳0</span>
        </div>
        <button onclick="toggleModal('cart-modal', false); toggleModal('checkout-modal', true);" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl text-sm transition">Checkout Now</button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-gray-100 mb-4">
        <h3 class="font-black text-lg">Checkout Order</h3>
        <button onclick="toggleModal('checkout-modal', false)" class="text-gray-400 font-bold"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="event.preventDefault(); processOrder();" class="space-y-3">
        <input type="text" id="cust-name" required placeholder="Full Name" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs font-semibold outline-none focus:border-indigo-600">
        <input type="tel" id="cust-phone" required placeholder="Phone Number" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs font-semibold outline-none focus:border-indigo-600">
        <select id="cust-city" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs font-semibold outline-none">
          <option value="Inside Dhaka">Inside Dhaka (৳60 Delivery)</option>
          <option value="Outside Dhaka">Outside Dhaka (৳120 Delivery)</option>
        </select>
        <textarea id="cust-address" required placeholder="Full Address" rows="2" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs font-semibold outline-none focus:border-indigo-600"></textarea>
        <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 space-y-2">
          <label class="flex items-center gap-2 text-xs font-bold text-gray-700">
            <input type="radio" name="payment_method" value="Cash on Delivery" checked class="accent-indigo-600"> Cash on Delivery
          </label>
        </div>
        <button type="submit" id="order-btn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs transition">Place Order Now</button>
      </form>
    </div>
  </div>

  <script>
    let allProducts = [], cart = [], selectedCategory = 'All';

    async function fetchProducts() {
      try {
        const res = await fetch('/api/phones');
        allProducts = await res.json();
        renderCategories();
        filterProducts();
      } catch(e) {}
    }

    function renderCategories() {
      const brands = ['All', ...new Set(allProducts.map(p => p.brand).filter(Boolean))];
      const container = document.getElementById('category-container');
      container.innerHTML = brands.map(b => `
        <button onclick="setCategory('${b}')" class="cat-btn ${selectedCategory === b ? 'bg-indigo-600 text-white' : 'bg-white border border-gray-200 text-gray-700'} font-bold px-4 py-2 rounded-2xl text-xs whitespace-nowrap shadow-sm">${b}</button>
      `).join('');
    }

    function setCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      filterProducts();
    }

    function clearPriceFilter() {
      document.getElementById('min-price').value = '';
      document.getElementById('max-price').value = '';
      filterProducts();
    }

    function filterProducts() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const minP = Number(document.getElementById('min-price').value) || 0;
      const maxP = Number(document.getElementById('max-price').value) || Infinity;

      const filtered = allProducts.filter(p => {
        const price = Number(p.price) || 0;
        const matchCat = selectedCategory === 'All' || p.brand === selectedCategory;
        const matchQ = p.title.toLowerCase().includes(q) || (p.brand && p.brand.toLowerCase().includes(q));
        const matchPrice = price >= minP && price <= maxP;
        return matchCat && matchQ && matchPrice;
      });

      const grid = document.getElementById('product-grid');
      if(!filtered.length) {
        grid.innerHTML = `<p class="col-span-full text-center py-10 text-gray-400 font-medium text-sm">No products match your filters</p>`;
        return;
      }

      const defaultImg = "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300";

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white border border-gray-200/80 rounded-2xl p-3 flex flex-col justify-between shadow-sm">
          <div>
            <div class="w-full h-36 bg-gray-50 rounded-xl overflow-hidden mb-2.5 border border-gray-100 flex items-center justify-center">
              <img src="${p.image || defaultImg}" onerror="this.src='${defaultImg}'" class="max-h-full max-w-full object-contain">
            </div>
            <span class="text-[10px] font-black uppercase tracking-wider text-indigo-500">${p.brand || 'Phone'}</span>
            <h3 class="font-bold text-xs text-gray-900 line-clamp-1 mt-0.5">${p.title}</h3>
            <p class="font-extrabold text-sm text-gray-900 mt-1">৳${Number(p.price).toLocaleString()}</p>
          </div>
          <button onclick="addToCart('${p.id}')" class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs mt-2 transition hover:bg-black">Add to Cart</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const p = allProducts.find(x => x.id === id);
      if(!p) return;
      const ex = cart.find(x => x.id === id);
      if(ex) ex.qty++; else cart.push({ ...p, qty: 1 });
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart-count').innerText = cart.reduce((s, x) => s + x.qty, 0);
      const items = document.getElementById('cart-items');
      items.innerHTML = cart.map(i => `
        <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border border-gray-200">
          <div>
            <h4 class="font-bold text-xs">${i.title}</h4>
            <p class="text-[11px] font-bold text-indigo-600">৳${Number(i.price).toLocaleString()} x ${i.qty}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty('${i.id}', -1)" class="w-6 h-6 bg-white border border-gray-300 rounded-lg text-xs font-bold">-</button>
            <span class="text-xs font-bold">${i.qty}</span>
            <button onclick="changeQty('${i.id}', 1)" class="w-6 h-6 bg-white border border-gray-300 rounded-lg text-xs font-bold">+</button>
          </div>
        </div>
      `).join('');
      document.getElementById('cart-total').innerText = '৳' + cart.reduce((s, x) => s + (x.price * x.qty), 0).toLocaleString();
    }

    function changeQty(id, delta) {
      const i = cart.find(x => x.id === id);
      if(!i) return;
      i.qty += delta;
      if(i.qty <= 0) cart = cart.filter(x => x.id !== id);
      updateCart();
    }

    function toggleModal(id, show) {
      document.getElementById(id).classList.toggle('hidden', !show);
    }

    async function processOrder() {
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const city = document.getElementById('cust-city').value;
      const address = document.getElementById('cust-address').value;
      const subtotal = cart.reduce((s, x) => s + (x.price * x.qty), 0);
      const delivery = city === 'Inside Dhaka' ? 60 : 120;

      const btn = document.getElementById('order-btn');
      btn.innerText = "Processing...";
      btn.disabled = true;

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer: { name, phone, city, address }, paymentMethod: 'Cash on Delivery', items: cart, total: subtotal + delivery })
        });
        const data = await res.json();
        if(data.success) {
          cart = [];
          updateCart();
          toggleModal('checkout-modal', false);
          alert('Order placed successfully!');
        }
      } catch(e) {} finally {
        btn.innerText = "Place Order Now";
        btn.disabled = false;
      }
    }

    fetchProducts();
  </script>
</body>
</html>
